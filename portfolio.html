function openPreview(p,trigger){lastTrigger=trigger;document.getElementById('previewTitle').textContent=p.title;document.getElementById('previewCategory').textContent=p.category;document.getElementById('previewDesc').textContent=p.desc;const holder=document.getElementById('previewImages');holder.replaceChildren();holder.className=(p.video||p.clips)?'preview-video':p.layout==='row'?'preview-row':'preview-stack';if(p.clips){p.clips.forEach(clip=>{const figure=document.createElement('figure');figure.className='video-clip';const label=document.createElement('figcaption');label.textContent=clip.title;const player=document.createElement('video');player.controls=true;player.playsInline=true;player.preload='none';player.poster=detailUrl(clip.poster);player.src=clip.src;player.setAttribute('aria-label',clip.title);player.addEventListener('play',()=>holder.querySelectorAll('video').forEach(other=>{if(other!==player)other.pause()}));figure.append(label,player);holder.append(figure)});modal.showModal();modal.scrollTop=0;return}if(p.video){const link=document.createElement('a');link.href=p.video;link.target='_blank';link.rel='noopener';link.className='pill';link.textContent='在 Instagram 觀看';const iframe=document.createElement('iframe');iframe.src=p.embed;iframe.title=p.title;iframe.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';iframe.allowFullscreen=true;holder.append(link,iframe);modal.showModal();modal.scrollTop=0;return}(p.images||[p.src]).forEach((src,i)=>{const img=picture(detailUrl(src),p.imageTitles?.[i]||p.title);if(i===0){img.loading='eager';img.fetchPriority='high'}holder.append(img)});holder.scrollTop=0;modal.showModal();modal.scrollTop=0}
function card(p){const article=document.createElement('article');article.className='item';const a=document.createElement('a');a.href='#作品-'+p.id;a.setAttribute('aria-label','預覽'+p.title);const frame=document.createElement('div');frame.className='frame'+(p.coverMat?' cover-mat':'');if(p.video||p.clips){frame.classList.add('video-cover','has-photo');frame.append(picture(thumbUrl(p.src),p.title));const play=document.createElement('span');play.className='play-mark';play.setAttribute('aria-hidden','true');frame.append(play)}else frame.append(picture(thumbUrl(p.src),p.title));const title=document.createElement('h3');title.textContent=p.title;const desc=document.createElement('p');desc.textContent=p.desc;const cover=frame.querySelector('img');const sizeCover=()=>{if(cover.naturalWidth&&cover.naturalHeight)frame.classList.toggle('cover-mat',Math.max(cover.naturalWidth,cover.naturalHeight)/Math.min(cover.naturalWidth,cover.naturalHeight)>2.5)};cover.addEventListener('load',sizeCover);if(cover.complete)sizeCover();a.append(frame);a.addEventListener('click',e=>{e.preventDefault();openPreview(p,a)});article.append(a);return article}
function currentIndustry(){const value=new URLSearchParams(location.search).get('industry');return industryGroups.some(([slug])=>slug===value)?value:null}
function render(){
 const filter=currentCategory(),industry=filter===categories[0][1]?currentIndustry():null;
 gallery.replaceChildren();
 document.getElementById('subfilters')?.remove();
 document.querySelectorAll('button.filter').forEach(b=>{const selected=b.dataset.filter===filter;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});
 const sub=document.createElement('nav');sub.id='subfilters';sub.className='subfilters';sub.setAttribute('aria-label','產業分類');sub.hidden=filter!==categories[0][1];
 if(!sub.hidden){
   const all=document.createElement('button');all.type='button';all.textContent='全部';all.className='filter'+(!industry?' active':'');all.setAttribute('aria-pressed',String(!industry));all.addEventListener('click',()=>selectIndustry(null));sub.append(all);
   industryGroups.forEach(([slug,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.className='filter'+(industry===slug?' active':'');b.setAttribute('aria-pressed',String(industry===slug));b.addEventListener('click',()=>selectIndustry(slug));sub.append(b)});
 }
 const groups=filter==='全部作品'?categories:categories.filter(c=>c[1]===filter);
 groups.forEach(([slug,name])=>{
  const section=document.createElement('section');section.className='category-group';
  const heading=document.createElement('h2');heading.className='category-heading';
  if(filter==='全部作品'){
   const link=document.createElement('a');link.href='portfolio.html?category='+slug;link.textContent=name;
   const arrow=document.createElement('span');arrow.className='category-arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='↗';link.append(arrow);
   link.addEventListener('click',e=>{e.preventDefault();select(name)});heading.append(link);
  }else{heading.textContent=name}
  const grid=document.createElement('div');grid.className='gallery';
  let entries=projects.filter(p=>p.category===name);
  if(industry&&slug==='social')entries=projects.filter(p=>industryIds[industry].includes(p.id));
  (filter==='全部作品'?entries.slice(0,4):entries).forEach(p=>grid.append(card(p)));
  section.append(heading);if(slug==='social'&&filter===name)section.append(sub);section.append(grid);gallery.append(section);
 });
}
function select(name){history.pushState({},'',name==='全部作品'?'portfolio.html':'portfolio.html?category='+slugFor(name));render();document.querySelector('.filters').scrollIntoView({block:'start',behavior:'smooth'})}
function selectIndustry(industry){const url='portfolio.html?category=social'+(industry?'&industry='+encodeURIComponent(industry):'');history.pushState({},'',url);render();document.getElementById('subfilters').scrollIntoView({block:'nearest',behavior:'smooth'})}
document.querySelectorAll('button.filter').forEach(b=>b.addEventListener('click',()=>select(b.dataset.filter)));window.addEventListener('popstate',render);document.getElementById('close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});modal.addEventListener('close',()=>{modal.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});document.getElementById('previewImages').replaceChildren();lastTrigger?.focus()});document.getElementById('menu').onclick=()=>document.getElementById('navlinks').classList.toggle('open');render();</script></body></html>
