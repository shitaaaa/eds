const gallery=document.getElementById('projectGallery'),modal=document.getElementById('preview');let lastTrigger=null;
function slugFor(category){return categories.find(c=>c[1]===category)?.[0]||''}
function currentCategory(){const slug=new URLSearchParams(location.search).get('category');return categories.find(c=>c[0]===(slug==='presentation'?'brand':slug))?.[1]||'全部作品'}
function picture(src,title){const img=document.createElement('img');img.src=src;img.alt=title;img.loading='lazy';return img}
function openPreview(p,trigger){lastTrigger=trigger;document.getElementById('previewTitle').textContent=p.title;document.getElementById('previewCategory').textContent=p.category;document.getElementById('previewDesc').textContent=p.desc;const holder=document.getElementById('previewImages');holder.replaceChildren();holder.className=p.video?'preview-video':p.layout==='row'?'preview-row':'preview-stack';if(p.video){const link=document.createElement('a');link.href=p.video;link.target='_blank';link.rel='noopener';link.className='pill';link.textContent='在 Instagram 觀看';const iframe=document.createElement('iframe');iframe.src=p.embed;iframe.title=p.title;iframe.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';iframe.allowFullscreen=true;holder.append(link,iframe);modal.showModal();modal.scrollTop=0;return}(p.images||[p.src]).forEach((src,i)=>holder.append(picture(src,p.imageTitles?.[i]||p.title)));holder.scrollTop=0;modal.showModal();modal.scrollTop=0}
function card(p){const article=document.createElement('article');article.className='item';const a=document.createElement('a');a.href='#作品-'+p.id;a.setAttribute('aria-label','預覽'+p.title);const frame=document.createElement('div');frame.className='frame';if(p.video){frame.classList.add('video-cover','has-photo');frame.append(picture(p.src,p.title));const play=document.createElement('span');play.className='play-mark';play.setAttribute('aria-hidden','true');frame.append(play)}else frame.append(picture(p.src,p.title));const title=document.createElement('h3');title.textContent=p.title;const desc=document.createElement('p');desc.textContent=p.desc;a.append(frame,title,desc);a.addEventListener('click',e=>{e.preventDefault();openPreview(p,a)});article.append(a);return article}
function render(){const filter=currentCategory();gallery.replaceChildren();document.querySelectorAll('button.filter').forEach(b=>{const selected=b.dataset.filter===filter;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});const groups=filter==='全部作品'?categories:categories.filter(c=>c[1]===filter);groups.forEach(([slug,name])=>{const section=document.createElement('section');section.className='category-group';const heading=document.createElement('h2');heading.className='category-heading';const link=document.createElement('a');link.href='portfolio.html?category='+slug;const label=document.createElement('span');label.textContent=name;link.append(label);const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('viewBox','0 0 24 24');arrow.setAttribute('class','category-arrow');arrow.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M5 19 19 5M5 5h14v14');path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','1.5');arrow.append(path);link.append(arrow);link.addEventListener('click',e=>{e.preventDefault();select(name)});heading.append(link);const grid=document.createElement('div');grid.className='gallery';const entries=projects.filter(p=>p.category===name);(filter==='全部作品'?entries.slice(0,4):entries).forEach(p=>grid.append(card(p)));section.append(heading,grid);gallery.append(section)})}
